name: Go tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Resolve dependencies
        run: go mod tidy
      - name: Show resolved module files (temporary for dependency lockfile)
        run: |
          echo '=== RESOLVED GO MOD BEGIN ==='
          cat go.mod
          echo '=== RESOLVED GO MOD END ==='
          echo '=== RESOLVED GO SUM BEGIN ==='
          cat go.sum
          echo '=== RESOLVED GO SUM END ==='
      - name: Test
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Browser JavaScript syntax
        run: node --check static/app.js
